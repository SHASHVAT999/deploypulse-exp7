apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp7-dashboard
  namespace: exp7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exp7-dashboard
  template:
    metadata:
      labels:
        app: exp7-dashboard
    spec:
      containers:
      - name: dashboard
        image: exp7-dashboard:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 250m
